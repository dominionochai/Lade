name: Temporary full-source migration
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Lade
        uses: actions/checkout@v4
        with:
          repository: dominionochai/Lade
          ref: main
          token: ${{ github.token }}
          fetch-depth: 0
      - name: Check out pinned source
        uses: actions/checkout@v4
        with:
          repository: calebevans/mulder
          ref: 5321847887fe1fcb5399cec0a1703db9c513bac8
          path: source
          persist-credentials: false
      - name: Copy source, validate, commit, and push
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "5321847887fe1fcb5399cec0a1703db9c513bac8"
          test "$(git hash-object README.md)" = "fed4a321cb71820f5e2abcd470d3cd321452efa7"
          test "$(git hash-object LICENSE)" = "caed799e2ea59f9c6234b8f3fde6ed91a66a683c"
          test "$(git hash-object NOTICE.md)" = "89e4efe92cd09141f73348b550163712e2c308e4"
          test -d lade
          rsync -a --delete \
            --exclude='/.git/' \
            --exclude='/README.md' \
            --exclude='/LICENSE' \
            --exclude='/NOTICE.md' \
            --exclude='/lade/' \
            --exclude='/.github/workflows/migrate.yml' \
            source/ ./
          test "$(git hash-object README.md)" = "fed4a321cb71820f5e2abcd470d3cd321452efa7"
          test "$(git hash-object LICENSE)" = "caed799e2ea59f9c6234b8f3fde6ed91a66a683c"
          test "$(git hash-object NOTICE.md)" = "89e4efe92cd09141f73348b550163712e2c308e4"
          test -d lade
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: copy mulder at 5321847"
            git push origin HEAD:main
          else
            echo "No content changes required"
          fi
          python3 - <<'PY'
          import subprocess
          def entries(repo, ref):
              raw = subprocess.check_output(['git', '-C', repo, 'ls-tree', '-rz', '--full-tree', ref])
              result = {}
              for record in raw.split(b'\0'):
                  if not record:
                      continue
                  meta, path = record.split(b'\t', 1)
                  mode, kind, sha = meta.split(b' ', 2)
                  path = path.decode('utf-8', 'surrogateescape')
                  if kind == b'blob':
                      result[path] = (mode.decode(), sha.decode())
              return result
          src = entries('source', 'HEAD')
          dst = entries('.', 'HEAD')
          src.pop('README.md', None)
          src.pop('LICENSE', None)
          mismatches = [(p, v, dst.get(p)) for p, v in src.items() if dst.get(p) != v]
          if mismatches:
              raise SystemExit(f'Path/mode/blob mismatches ({len(mismatches)}): {mismatches[:30]}')
          sizes = []
          for path, (_, sha) in src.items():
              size = int(subprocess.check_output(['git', '-C', 'source', 'cat-file', '-s', sha]))
              sizes.append((size, path))
          print(f'INVENTORY_OK source_commit=5321847887fe1fcb5399cec0a1703db9c513bac8 copied_files={len(src)} total_bytes={sum(x for x, _ in sizes)}')
          for size, path in sorted(sizes, reverse=True)[:10]:
              print(f'LARGEST {size} {path}')
          PY
          git push origin HEAD:main
