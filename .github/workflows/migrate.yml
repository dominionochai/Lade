name: One-time source migration
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out destination repository
        uses: actions/checkout@v7
        with:
          repository: dominionochai/Lade
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Fetch pinned public source into a separate directory
        env:
          SOURCE_REF: 5321847887fe1fcb5399cec0a1703db9c513bac8
        run: |
          set -euo pipefail
          SOURCE_DIR=/tmp/mulder-src
          rm -rf -- "$SOURCE_DIR"
          git init "$SOURCE_DIR"
          git -C "$SOURCE_DIR" remote add origin https://github.com/calebevans/mulder.git
          git -C "$SOURCE_DIR" fetch --no-tags --depth=1 origin "$SOURCE_REF"
          git -C "$SOURCE_DIR" checkout --detach FETCH_HEAD
          test "$(git -C "$SOURCE_DIR" rev-parse HEAD)" = "$SOURCE_REF"

      - name: Copy source files, validate inventory and blobs, stage and push
        env:
          SOURCE_DIR: /tmp/mulder-src
          SOURCE_REF: 5321847887fe1fcb5399cec0a1703db9c513bac8
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          test "$(git -C "$SOURCE_DIR" rev-parse HEAD)" = "$SOURCE_REF"
          test -d lade
          test "$(git hash-object README.md)" = "fed4a321cb71820f5e2abcd470d3cd321452efa7"
          test "$(git hash-object LICENSE)" = "caed799e2ea59f9c6234b8f3fde6ed91a66a683c"
          test "$(git hash-object NOTICE.md)" = "89e4efe92cd09141f73348b550163712e2c308e4"

          rsync -a \
            --exclude='/README.md' \
            --exclude='/LICENSE' \
            --exclude='/NOTICE.md' \
            --exclude='/.git/' \
            --exclude='/.github/workflows/***' \
            /tmp/mulder-src/ "$GITHUB_WORKSPACE/"

          test -d lade
          inventory="$RUNNER_TEMP/mulder-source-inventory.tsv"
          : > "$inventory"
          count=0
          while IFS= read -r -d '' path; do
            case "$path" in
              README.md|LICENSE|NOTICE.md|.github/workflows/*) continue ;;
            esac
            target="$GITHUB_WORKSPACE/$path"
            if [[ ! -e "$target" && ! -L "$target" ]]; then
              echo "Missing copied source path: $path" >&2
              exit 1
            fi
            source_blob="$(git -C "$SOURCE_DIR" rev-parse "$SOURCE_REF:$path")"
            destination_blob="$(git -C "$GITHUB_WORKSPACE" hash-object -- "$target")"
            if [[ "$source_blob" != "$destination_blob" ]]; then
              echo "Blob mismatch for $path: source=$source_blob destination=$destination_blob" >&2
              exit 1
            fi
            printf '%s\t%s\n' "$path" "$source_blob" >> "$inventory"
            count=$((count + 1))
          done < <(git -C "$SOURCE_DIR" ls-tree -r -z --name-only "$SOURCE_REF")

          test "$count" -gt 0
          test "$(git hash-object README.md)" = "fed4a321cb71820f5e2abcd470d3cd321452efa7"
          test "$(git hash-object LICENSE)" = "caed799e2ea59f9c6234b8f3fde6ed91a66a683c"
          test "$(git hash-object NOTICE.md)" = "89e4efe92cd09141f73348b550163712e2c308e4"
          {
            echo '## Pinned source migration inventory'
            echo "Source: calebevans/mulder@$SOURCE_REF"
            echo "Destination: dominionochai/Lade (main); root README.md, LICENSE, NOTICE.md and lade/ preserved."
            echo "Copied and Git-blob-verified source files: $count"
            echo
            echo '```text'
            cat "$inventory"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore: migrate pinned mulder source'
          fi
          git push origin HEAD:main
          test -d lade
          test "$(git hash-object README.md)" = "fed4a321cb71820f5e2abcd470d3cd321452efa7"
          test "$(git hash-object LICENSE)" = "caed799e2ea59f9c6234b8f3fde6ed91a66a683c"
          test "$(git hash-object NOTICE.md)" = "89e4efe92cd09141f73348b550163712e2c308e4"
