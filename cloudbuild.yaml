# Cloud Build configuration for Lade Cloud Run deployment
# This file is used by `gcloud builds submit --config cloudbuild.yaml`

steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/lade-docker/lade-webhook:$COMMIT_SHA'
      - '-f'
      - 'Dockerfile.cloudrun'
      - '.'
    id: 'build-image'

  # Push the image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/lade-webhook:$COMMIT_SHA'
    id: 'push-image'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/lade-webhook:$COMMIT_SHA'
      - '--region'
      - '${_REGION}'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '2'
      - '--no-cpu-throttling'
      - '--min-instances'
      - '1'
      - '--max-instances'
      - '1'
      - '--concurrency'
      - '1'
      - '--timeout'
      - '3600'
      - '--port'
      - '8080'
      - '--set-env-vars'
      - 'LADE_EVIDENCE_ROOT=/app/evidence'
      - '--set-secrets'
      - 'GITLAB_WEBHOOK_SECRET=GITLAB_WEBHOOK_SECRET:latest,ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest,MCP_AUTH_TOKEN=MCP_AUTH_TOKEN:latest'
      - '--service-account'
      - '${_SERVICE_NAME}@$PROJECT_ID.iam.gserviceaccount.com'
      - '--project'
      - '$PROJECT_ID'
      - '--quiet'
    id: 'deploy-cloudrun'

  # Get service URL and output
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'services'
      - 'describe'
      - '${_SERVICE_NAME}'
      - '--region'
      - '${_REGION}'
      - '--project'
      - '$PROJECT_ID'
      - '--format'
      - 'value(status.url)'
    id: 'get-service-url'

# Build options
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

# Substitutions (can be overridden at build time)
substitutions:
  _REGION: 'europe-west1'
  _SERVICE_NAME: 'lade-webhook'

# Tags for filtering
tags:
  - 'lade'
  - 'webhook'
  - 'cloudrun'